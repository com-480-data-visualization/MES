<!DOCTYPE html>
<html lang="en" data-scene-theme="evening">
<head>
    <link rel="stylesheet" href="src/styles/style.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MES</title>
    <style>
        body { margin: 0; }
    </style>
</head>
<body>
<script type="module" src="/src/main.js"></script>
<button
    id="homeButton"
    class="home-button viz-ui is-hidden"
    type="button"
    aria-label="Return to welcome screen"
    title="Return to welcome screen"
>
    <span class="home-icon" aria-hidden="true"></span>
</button>
<div class="scene-controls">
    <button
        id="settingsButton"
        class="settings-toggle"
        type="button"
        aria-label="Open settings"
        aria-controls="settingsPanel"
        aria-expanded="false"
        title="Open settings"
    >
        <span class="settings-toggle-icon" aria-hidden="true"></span>
    </button>
    <button
        id="themeButton"
        class="theme-toggle"
        type="button"
        aria-label="Switch to morning mode"
        title="Switch to morning mode"
    >
        <span class="theme-toggle-icon" aria-hidden="true"></span>
    </button>
    <section id="settingsPanel" class="settings-panel" hidden>
        <label class="settings-field" for="musicVolume">
            <span>Music volume</span>
            <span id="musicVolumeValue" class="settings-value">25%</span>
            <input id="musicVolume" type="range" min="0" max="100" step="1" value="25">
        </label>
        <div class="settings-field settings-speed-field" role="group" aria-labelledby="animationSpeedLabel">
            <span id="animationSpeedLabel">Animation speed</span>
            <div class="settings-speed-options">
                <button type="button" data-speed-multiplier="1" aria-pressed="true">x1</button>
                <button type="button" data-speed-multiplier="2" aria-pressed="false">x2</button>
                <button type="button" data-speed-multiplier="4" aria-pressed="false">x4</button>
                <button type="button" data-speed-multiplier="16" aria-pressed="false">x16</button>
            </div>
        </div>
        <label class="settings-field" for="githubTokenInput">
            <span>GitHub token</span>
            <input
                id="githubTokenInput"
                type="password"
                placeholder="Personal access token"
                autocomplete="off"
                spellcheck="false"
            >
        </label>
    </section>
</div>
<main id="welcomeOverlay" class="welcome-overlay">
    <section class="welcome-panel">
        <p class="welcome-kicker">Repository visualization</p>
        <h1>MES</h1>
        <form id="repoForm" class="welcome-form">
            <label for="repoUrl">GitHub repository URL</label>
            <div class="welcome-input-row">
                <input
                    id="repoUrl"
                    name="repoUrl"
                    type="text"
                    placeholder="https://github.com/owner/repository"
                    autocomplete="url"
                    required
                >
                <button type="submit">Enter</button>
            </div>
        </form>
    </section>
</main>
<div id="container" class="viz-ui is-hidden">
    <div id="box1" class="box">
        <span id="repoLabel">Repository selected</span><br>
        <svg id="general-graph" width="200" height="200"></svg>
        <main class="ld_card">
            <h3 id="ld_header">Top Committers</h3>
            <div id="leaderboard" class="leaderboard ld_scrollbar"></div>
        </main>
    </div>
    <div id="user-container"></div>
</div>

<div class="chrono viz-ui is-hidden">
    <svg class="chrono-svg" viewBox="0 0 220 220">
        <circle class="outer-ring" cx="110" cy="110" r="100" />
        <circle class="progress-bg" cx="110" cy="110" r="78" />
        <circle class="progress-ring" cx="110" cy="110" r="78" />
    </svg>
    <div class="time" id="time">00:00</div>
</div>
</body>

</html>
